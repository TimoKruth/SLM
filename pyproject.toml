[project]
name = "benchmark-slm"
version = "0.1.0"
description = "Locally trained benchmark-only language model experiments"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx>=0.29,<0.32",
  "numpy>=2.0,<3",
  "tokenizers>=0.21,<0.23",
  "huggingface-hub>=0.34,<2",
  "pyarrow>=19,<24",
  "psutil>=7,<8",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
